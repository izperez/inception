version: '3.8'

services:
  nginx:
    build: requirements/nginx/.
    container_name: nginx
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - /home/izperez/data/web:/var/www/html
    secrets:
      - ssl-cert
      - ssl-key
    depends_on:
      - wordpress
    networks:
      - inception
  wordpress:
    build: requirements/wordpress/.
    container_name: wp-php
    env_file:
      - .env
    volumes:
      - /home/izperez/data/web:/var/www/html
    expose:
      - 9000
    depends_on:
      - mariadb
    networks:
      - inception
    secrets:
      - db-user
      - db-password
      - wp-admin-user
      - wp-admin-password
      - wp-user-password
  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb
    volumes:
     -  /home/izperez/data/database:/var/lib/mysql
    networks:
      - inception
    secrets:
      - db-user
      - db-password
    expose:
      - 3306
networks:
  inception:

secrets:
  ssl-cert:
    file: ../secrets/self-signed.crt
  ssl-key:
    file: ../secrets/self-signed.key
  db-user:
    file: ../secrets/db-user
  db-password:
    file: ../secrets/db-password
  wp-admin-user:
    file: ../secrets/wp-admin-user
  wp-admin-password:
    file: ../secrets/wp-admin-password
  wp-user-password:
    file: ../secrets/wp-user-password
      